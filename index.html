<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suture Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow: hidden; touch-action: none; background: black; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col">
    
    <div class="relative flex-grow w-full flex justify-center items-center overflow-hidden">
        <video id="videoFeed" autoplay playsinline></video>
        
        <div id="flashEffect" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-50 transition-opacity duration-100"></div>

        <div class="absolute w-[80%] h-[30%] border-2 border-yellow-400 rounded-xl shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]"></div>
        
        <div class="absolute top-4 left-4 bg-black/60 text-gray-300 px-3 py-2 rounded-xl font-mono text-xs z-30 space-y-1">
            <div class="font-bold text-white mb-1 border-b border-gray-600 pb-1">PAPER METRICS</div>
            <div>AI Time: <span id="statTime" class="text-blue-400">0.0s</span></div>
            <div>Accuracy: <span id="statAcc" class="text-green-400">100%</span></div>
        </div>

        <div class="absolute top-4 right-4 flex flex-col gap-2 z-30 font-mono text-sm">
            <div class="bg-black/60 text-white px-4 py-2 rounded-full border border-gray-600 shadow-lg text-right">
                Scans: <span id="count" class="font-bold text-blue-400 text-lg">0</span>
            </div>
            <div id="queueContainer" class="bg-blue-900/80 text-white px-4 py-2 rounded-full border border-blue-500 shadow-lg text-right hidden transition-all">
                Processing: <span id="queueCount" class="font-bold text-blue-200 text-lg animate-pulse">0</span>
            </div>
        </div>

        <div id="latestScanData" class="absolute bottom-4 left-4 right-4 bg-black/80 text-white p-4 rounded-xl font-mono text-sm z-30 border border-green-500/50 hidden backdrop-blur-md transition-opacity">
            <div class="font-bold text-green-400 mb-2 border-b border-gray-600 pb-1 flex justify-between items-center">
                <span>LAST CAPTURED</span>
                <div class="flex items-center gap-2">
                    <button id="triggerEditBtn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white text-xs px-3 py-1 rounded-lg font-bold transition-all shadow-md">Edit Data</button>
                    <span id="scanStatusIndicator" class="text-xs px-2 py-0.5 rounded-full bg-green-900/50 text-green-300 border border-green-700">Success</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-y-2 gap-x-4">
                <div class="text-gray-400">Brand: <span id="outBrand" class="text-white font-semibold block truncate"></span></div>
                <div class="text-gray-400">Material: <span id="outMaterial" class="text-white font-semibold block truncate"></span></div>
                <div class="text-gray-400">Size: <span id="outSize" class="text-white font-semibold block truncate"></span></div>
                <div class="text-gray-400">Expiry: <span id="outExpiry" class="text-white font-semibold block truncate"></span></div>
            </div>
        </div>
    </div>

    <div class="p-8 bg-gray-900 border-t border-gray-800 relative z-30">
        <button id="snapBtn" class="w-full h-20 bg-blue-600 active:bg-blue-700 text-white font-bold rounded-2xl shadow-xl transition-all active:scale-95 text-xl tracking-wide">
            CAPTURE SUTURE
        </button>
    </div>

    <div id="editModal" class="hidden absolute inset-0 bg-black/90 flex items-center justify-center z-50 p-6 backdrop-blur-md transition-opacity overflow-y-auto">
       <div class="bg-gray-800 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl border border-gray-700 my-auto">
           <h2 id="modalTitle" class="text-white text-2xl font-bold mb-1">Verify Details</h2>
           <p id="modalSubtitle" class="text-gray-400 text-sm mb-6">Correct any inaccuracies below.</p>
           
           <div class="space-y-4 mb-6 text-left">
               <div>
                   <label class="block text-xs text-gray-400 mb-1 font-bold">BRAND</label>
                   <input type="text" id="editBrand" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white font-semibold focus:border-blue-500 focus:outline-none">
               </div>
               <div>
                   <label class="block text-xs text-gray-400 mb-1 font-bold">MATERIAL</label>
                   <input type="text" id="editMaterial" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white font-semibold focus:border-blue-500 focus:outline-none">
               </div>
               <div>
                   <label class="block text-xs text-gray-400 mb-1 font-bold">SIZE (Thread Gauge)</label>
                   <input type="text" id="editSize" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white font-semibold focus:border-blue-500 focus:outline-none">
               </div>
               <div>
                   <label class="block text-xs text-gray-400 mb-1 font-bold">EXPIRATION DATE</label>
                   <input type="text" id="editExpiry" class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-3 text-white font-semibold focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
               </div>
           </div>
           
           <div class="flex gap-3 justify-center">
               <button id="rescanBtn" class="flex-1 bg-red-600/20 text-red-400 border border-red-900/50 active:bg-red-600/40 py-4 rounded-xl font-bold transition-colors">Discard & Retake</button>
               <button id="saveEditBtn" class="flex-1 bg-blue-600 active:bg-blue-700 py-4 rounded-xl text-white font-bold shadow-lg transition-all active:scale-95">Save Data</button>
           </div>
       </div>
    </div>

    <script>
        const video = document.getElementById('videoFeed');
        const countSpan = document.getElementById('count');
        const snapBtn = document.getElementById('snapBtn');
        const editModal = document.getElementById('editModal');
        const queueContainer = document.getElementById('queueContainer');
        const queueCountSpan = document.getElementById('queueCount');
        
        let scanCount = 0;
        let successfulFirstPass = 0;
        let processingCount = 0;
        let reviewQueue = [];
        let isModalOpen = false;
        
        let lastScanData = null; 
        let currentReviewData = null; 

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } } 
                });
                video.srcObject = stream;
            } catch (err) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            }
        }
        startCamera();

        function triggerFlash() {
            const flash = document.getElementById('flashEffect');
            flash.classList.remove('opacity-0');
            flash.classList.add('opacity-100');
            setTimeout(() => {
                flash.classList.remove('opacity-100');
                flash.classList.add('opacity-0');
            }, 100);
        }

        function updateQueueUI() {
            queueCountSpan.innerText = processingCount;
            if (processingCount > 0) queueContainer.classList.remove('hidden');
            else queueContainer.classList.add('hidden');
        }

        function updateMetricsUI(aiTime, isSuccess) {
            document.getElementById('statTime').innerText = aiTime + 's';
            if (isSuccess) successfulFirstPass++;
            
            const completedScans = scanCount + (isSuccess ? 0 : 1); 
            const accuracy = completedScans > 0 ? Math.round((successfulFirstPass / completedScans) * 100) : 100;
            
            const accSpan = document.getElementById('statAcc');
            accSpan.innerText = accuracy + '%';
            if(accuracy < 80) accSpan.className = "text-red-400";
            else if(accuracy < 95) accSpan.className = "text-yellow-400";
            else accSpan.className = "text-green-400";
        }

        function showLatestScan(data, statusText, statusClass) {
            const latestScanBox = document.getElementById('latestScanData');
            const statusIndicator = document.getElementById('scanStatusIndicator');
            
            latestScanBox.classList.remove('hidden');
            document.getElementById('outBrand').innerText = data.Brand;
            document.getElementById('outMaterial').innerText = data.Material;
            document.getElementById('outSize').innerText = data.Size;
            document.getElementById('outExpiry').innerText = data.Expiration_Date;
            
            statusIndicator.innerText = statusText;
            statusIndicator.className = statusClass;
            lastScanData = data;
        }
        
        function populateAndShowEditModal(data, isMissingAlert = false) {
            document.getElementById('editBrand').value = data.Brand !== 'Unknown' ? data.Brand : '';
            document.getElementById('editMaterial').value = data.Material !== 'Unknown' ? data.Material : '';
            document.getElementById('editSize').value = data.Size !== 'Unknown' ? data.Size : '';
            document.getElementById('editExpiry').value = data.Expiration_Date !== 'Unknown' ? data.Expiration_Date : '';
            
            const title = document.getElementById('modalTitle');
            const subtitle = document.getElementById('modalSubtitle');
            
            if (isMissingAlert) {
                title.innerHTML = "<span class='text-red-400'>Missing Data!</span>";
                subtitle.innerText = "Please fill in the blanks or discard this scan.";
            } else {
                title.innerText = "Edit Data";
                subtitle.innerText = "Correct any OCR inaccuracies below.";
            }
            
            editModal.classList.remove('hidden');
        }

        function processReviewQueue() {
            if (!isModalOpen && reviewQueue.length > 0) {
                isModalOpen = true;
                currentReviewData = reviewQueue.shift();
                populateAndShowEditModal(currentReviewData, true);
            }
        }

        snapBtn.addEventListener('click', async () => {
            triggerFlash();
            processingCount++;
            updateQueueUI();

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('image', blob);

                try {
                    const response = await fetch('/scan-suture/', { method: 'POST', body: formData });
                    const result = await response.json();
                    
                    processingCount--;
                    updateQueueUI();

                    if (result.status === "success") {
                        if (result.has_missing) {
                            updateMetricsUI(result.processing_time, false);
                            reviewQueue.push(result.data);
                            processReviewQueue(); 
                        } else {
                            scanCount++;
                            countSpan.innerText = scanCount;
                            updateMetricsUI(result.processing_time, true);
                            
                            showLatestScan(
                                result.data, 
                                "Success", 
                                "text-xs px-2 py-0.5 rounded-full bg-green-900/50 text-green-300 border border-green-700"
                            );
                        }
                    }
                } catch (err) {
                    console.error("Upload failed", err);
                    processingCount--;
                    updateQueueUI();
                }
            }, 'image/jpeg', 0.85);
        });

        document.getElementById('triggerEditBtn').addEventListener('click', () => {
            if (lastScanData) {
                isModalOpen = true;
                currentReviewData = lastScanData;
                populateAndShowEditModal(lastScanData, false);
            }
        });

        document.getElementById('saveEditBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveEditBtn');
            btn.innerText = "Saving...";
            btn.disabled = true;
            
            const formData = new FormData();
            formData.append('old_brand', currentReviewData.Brand);
            formData.append('old_material', currentReviewData.Material);
            formData.append('old_size', currentReviewData.Size);
            formData.append('old_expiry', currentReviewData.Expiration_Date);
            
            formData.append('new_brand', document.getElementById('editBrand').value || 'Unknown');
            formData.append('new_material', document.getElementById('editMaterial').value || 'Unknown');
            formData.append('new_size', document.getElementById('editSize').value || 'Unknown');
            formData.append('new_expiry', document.getElementById('editExpiry').value || 'Unknown');

            try {
                const response = await fetch('/edit-suture/', { method: 'POST', body: formData });
                const result = await response.json();
                
                if (result.status === "success") {
                    scanCount++;
                    countSpan.innerText = scanCount;
                    
                    showLatestScan(
                        result.data, 
                        "Corrected", 
                        "text-xs px-2 py-0.5 rounded-full bg-blue-900/50 text-blue-300 border border-blue-700"
                    );
                }
            } catch (err) {
                alert("Failed to save changes.");
            } finally {
                btn.innerText = "Save Data";
                btn.disabled = false;
                
                editModal.classList.add('hidden');
                isModalOpen = false;
                processReviewQueue();
            }
        });

        document.getElementById('rescanBtn').addEventListener('click', async () => {
            const btn = document.getElementById('rescanBtn');
            btn.innerText = "Discarding...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('brand', currentReviewData.Brand);
            formData.append('material', currentReviewData.Material);
            formData.append('size', currentReviewData.Size);
            formData.append('expiry', currentReviewData.Expiration_Date);

            try {
                await fetch('/discard-suture/', { method: 'POST', body: formData });
            } catch (err) {
                console.error("Failed to discard");
            } finally {
                btn.innerText = "Discard & Retake";
                btn.disabled = false;

                editModal.classList.add('hidden');
                isModalOpen = false;
                processReviewQueue();
            }
        });
    </script>
</body>
</html>
